<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIスネークゲーム</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --accent: #4ade80;
      --accent-dark: #22c55e;
      --p2: #38bdf8;
      --p2-dark: #0ea5e9;
      --food: #f43f5e;
      --grid: #0f3460;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-align: center;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .scoreboard {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .scoreboard b { color: var(--accent); }
    .scoreboard .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .snake-stat.s1 .dot { background: var(--accent); }
    .snake-stat.s1 b { color: var(--accent); }
    .snake-stat.s2 .dot { background: var(--p2); }
    .snake-stat.s2 b { color: var(--p2); }
    .snake-stat.dead { opacity: 0.45; text-decoration: line-through; }

    .stage {
      position: relative;
      background: var(--panel);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      background: var(--grid);
      border-radius: 8px;
      width: 400px;
      height: 400px;
      max-width: 90vw;
      max-height: 90vw;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      background: rgba(22, 33, 62, 0.92);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.3rem; color: var(--accent); }
    .overlay p { font-size: 0.9rem; line-height: 1.6; opacity: 0.9; }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    button {
      background: var(--accent);
      color: #06281a;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.2s ease;
    }
    button:hover { background: var(--accent-dark); }
    button:active { transform: scale(0.96); }
    button.secondary {
      background: var(--panel);
      color: var(--accent);
      border: 1px solid var(--grid);
    }
    button.secondary:hover { background: var(--grid); }

    .speed, .mode {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    input[type="range"] { accent-color: var(--accent); }

    select {
      background: var(--panel);
      color: var(--accent);
      border: 1px solid var(--grid);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }
    .mode.s2 select { color: var(--p2); }
    select:disabled { opacity: 0.5; cursor: not-allowed; }
    option { color: #06281a; }

    .hidden { display: none !important; }

    .status {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
      text-align: center;
    }
    .status .dir.s1 { color: var(--accent); font-weight: bold; text-transform: uppercase; }
    .status .dir.s2 { color: var(--p2); font-weight: bold; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>🤖🐍 AIスネークゲーム</h1>
  <div class="subtitle" id="subtitle">Djangoサーバー上の2匹のAIがヘビを自動操作します</div>

  <div class="scoreboard">
    <div class="snake-stat s1" id="stat0"><span class="dot"></span>S1 スコア: <b id="score0">0</b> 長さ: <b id="length0">0</b></div>
    <div class="snake-stat s2" id="stat1"><span class="dot"></span>S2 スコア: <b id="score1">0</b> 長さ: <b id="length1">0</b></div>
    <div>手数: <b id="steps">0</b></div>
    <div>ハイスコア: <b id="highScore">0</b></div>
  </div>

  <div class="stage">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">AIスネークゲーム</h2>
      <p id="overlayText">
        「スタート」を押すと、サーバー側のAIが<br>
        エサを目指してヘビを動かします。
      </p>
      <button id="startBtn">スタート</button>
    </div>
  </div>

  <div class="controls">
    <div class="mode">
      モード
      <select id="modeSelect">
        <option value="battle" selected>2匹で対戦</option>
        <option value="solo">1匹で操作</option>
      </select>
    </div>
    <div class="mode s1">
      <span id="s1Label">S1 AI</span>
      <select id="strategySelect0">
        <option value="search">探索AI (BFS)</option>
        <option value="rl">学習済みAI (features/MLP)</option>
        <option value="rl_cnn">学習済みAI (ego/CNN)</option>
        <option value="rl_trf">学習済みAI (ego/Transformer)</option>
      </select>
    </div>
    <div class="mode s2" id="s2Controls">
      S2 AI
      <select id="strategySelect1">
        <option value="search" selected>探索AI (BFS)</option>
        <option value="rl">学習済みAI (features/MLP)</option>
        <option value="rl_cnn">学習済みAI (ego/CNN)</option>
        <option value="rl_trf">学習済みAI (ego/Transformer)</option>
      </select>
    </div>
    <div class="mode">
      盤面
      <select id="gridSelect">
        <option value="10">10×10</option>
        <option value="14">14×14</option>
        <option value="20" selected>20×20</option>
        <option value="30">30×30</option>
        <option value="40">40×40</option>
      </select>
    </div>
    <button id="pauseBtn" class="secondary" disabled>一時停止</button>
    <button id="restartBtn" class="secondary">新規ゲーム</button>
    <div class="speed">
      速度
      <input type="range" id="speedRange" min="30" max="300" step="10" value="110">
    </div>
  </div>

  <div class="status" id="status"></div>

  <script>
    (function () {
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEls = [document.getElementById('score0'), document.getElementById('score1')];
      const lengthEls = [document.getElementById('length0'), document.getElementById('length1')];
      const statEls = [document.getElementById('stat0'), document.getElementById('stat1')];
      const stepsEl = document.getElementById('steps');
      const highScoreEl = document.getElementById('highScore');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const restartBtn = document.getElementById('restartBtn');
      const speedRange = document.getElementById('speedRange');
      const strategySelects = [
        document.getElementById('strategySelect0'),
        document.getElementById('strategySelect1'),
      ];
      const gridSelect = document.getElementById('gridSelect');
      const statusEl = document.getElementById('status');
      const modeSelect = document.getElementById('modeSelect');
      const s2Controls = document.getElementById('s2Controls');
      const s1Label = document.getElementById('s1Label');
      const subtitleEl = document.getElementById('subtitle');

      // Colors for snake 0 (head/body) and snake 1 (head/body).
      const SNAKE_COLORS = [
        ['#4ade80', '#22c55e'],
        ['#38bdf8', '#0ea5e9'],
      ];

      let gameId = null;
      let state = null;
      let running = false;
      let paused = false;
      let stepDelay = Number(speedRange.value); // ms between AI moves
      let timer = null;
      let CELL = 20;
      let socket = null; // WebSocket carrying the per-step traffic

      // High scores are kept per board size (a 10x10 score and a 40x40 score
      // are not comparable). The value stored is the best of either snake.
      function highKey(grid) { return 'aiSnakeHighScore_' + grid; }
      function loadHighScore(grid) {
        return Number(localStorage.getItem(highKey(grid)) || 0);
      }
      let highScore = loadHighScore(Number(gridSelect.value));
      highScoreEl.textContent = highScore;

      // Per-strategy metadata from the server: { grid: <int|null>, available }.
      // grid is the board size a model requires (null = any size).
      let strategyMeta = {};
      const baseLabels = {};
      strategySelects[0].querySelectorAll('option').forEach((o) => {
        baseLabels[o.value] = o.textContent;
      });

      // 1 snake ("solo") or 2 ("battle"); the server mirrors whichever count
      // of strategies it's sent, so this is the only place that decides it.
      function isSolo() { return modeSelect.value === 'solo'; }
      function activeStrategies() {
        return isSolo() ? [strategySelects[0].value] : strategySelects.map((s) => s.value);
      }

      function applyMode() {
        const solo = isSolo();
        s2Controls.classList.toggle('hidden', solo);
        statEls[1].classList.toggle('hidden', solo);
        s1Label.textContent = solo ? 'AI' : 'S1 AI';
        subtitleEl.textContent = solo
          ? 'Djangoサーバー上のAIがヘビを自動操作します'
          : 'Djangoサーバー上の2匹のAIがヘビを自動操作します';
      }
      applyMode();

      async function api(path, body) {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {}),
        });
        if (!res.ok) throw new Error('API error ' + res.status);
        return res.json();
      }

      // Per-step traffic goes over a WebSocket (one connection per game)
      // instead of a POST per tick. Resolves once the socket is open.
      function openSocket(id) {
        return new Promise((resolve, reject) => {
          const proto = location.protocol === 'https:' ? 'wss' : 'ws';
          const ws = new WebSocket(proto + '://' + location.host + '/ws/game/' + id + '/');
          let opened = false;

          ws.addEventListener('open', () => {
            opened = true;
            resolve(ws);
          });

          ws.addEventListener('message', (evt) => {
            if (ws !== socket) return; // late message from a replaced connection
            handleStepMessage(JSON.parse(evt.data));
          });

          ws.addEventListener('close', () => {
            if (ws !== socket) return;
            if (running) {
              statusEl.textContent = '通信が切断されました';
              stopLoop();
            }
          });

          ws.addEventListener('error', () => {
            if (!opened) reject(new Error('WebSocket接続に失敗しました'));
          });

          socket = ws;
        });
      }

      function applyState(s) {
        state = s;
        CELL = canvas.width / s.grid;
        // Clear stale "dead" styling first: a solo game only touches
        // statEls[0] below, so a previous battle's statEls[1] wouldn't
        // otherwise be reset.
        statEls.forEach((el) => el.classList.remove('dead'));
        s.snakes.forEach((snake, i) => {
          scoreEls[i].textContent = snake.score;
          lengthEls[i].textContent = snake.length;
          statEls[i].classList.toggle('dead', !snake.alive);
        });
        stepsEl.textContent = s.steps;
        draw();
      }

      // Can strategy `s` run on a board of the given size?
      function fitsBoard(s, gridSize) {
        const meta = strategyMeta[s];
        if (!meta) return true;              // "search" isn't in the registry
        return meta.grid == null || meta.grid === gridSize;
      }

      function applyStrategyMeta(meta) {
        strategyMeta = meta || {};
        strategySelects.forEach((select) => {
          Object.entries(strategyMeta).forEach(([value, m]) => {
            const opt = select.querySelector('option[value="' + value + '"]');
            if (!opt) return;
            opt.disabled = !m.available;
            opt.textContent = baseLabels[value] + (m.available ? '' : ' — 利用不可');
          });
          // If the current selection became unavailable, revert to search.
          const cur = strategyMeta[select.value];
          if (cur && !cur.available) select.value = 'search';
        });
      }

      async function newGame() {
        stopLoop();
        if (socket) {
          socket.close();
          socket = null;
        }
        const data = await api('/api/new/', {
          strategies: activeStrategies(),
          grid: Number(gridSelect.value),
        });
        gameId = data.game_id;
        applyStrategyMeta(data.strategies);
        applyState(data.state);
        highScore = loadHighScore(data.state.grid);
        highScoreEl.textContent = highScore;

        statusEl.textContent = '接続中...';
        try {
          await openSocket(gameId);
        } catch (e) {
          statusEl.textContent = '通信エラー: ' + e.message;
          return;
        }

        overlay.classList.add('hidden');
        running = true;
        paused = false;
        pauseBtn.disabled = false;
        pauseBtn.textContent = '一時停止';
        statusEl.textContent = 'AIが思考中...';
        scheduleTick();
      }

      function scheduleTick() {
        clearTimeout(timer);
        timer = setTimeout(tick, stepDelay);
      }

      function stopLoop() {
        running = false;
        clearTimeout(timer);
      }

      // Fire one step request over the socket; the response arrives
      // asynchronously in handleStepMessage.
      function tick() {
        if (!running || paused) return;
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          statusEl.textContent = '通信エラー: WebSocketが接続されていません';
          return;
        }
        socket.send(JSON.stringify({ strategies: activeStrategies() }));
      }

      const STRATEGY_LABELS = {
        search: '探索AI(BFS)',
        rl: '学習済みAI(MLP)',
        rl_cnn: '学習済みAI(CNN)',
        rl_trf: '学習済みAI(Transformer)',
      };

      function handleStepMessage(data) {
        if (data.error) {
          statusEl.textContent = '通信エラー: ' + data.error;
          stopLoop();
          return;
        }
        applyState(data.state);

        const solo = data.state.snakes.length === 1;
        statusEl.innerHTML = data.state.snakes.map((snake, i) => {
          const tag = solo ? '' : 'S' + (i + 1) + ': ';
          if (!snake.alive) return tag + '死亡';
          const label = STRATEGY_LABELS[data.strategies[i]] || data.strategies[i];
          return tag + label + ' → <span class="dir s' + (i + 1) + '">' +
            data.directions[i] + '</span>';
        }).join('　｜　') + '　（盤面 ' + state.grid + '×' + state.grid + '）';

        if (data.state.game_over) {
          return endGame();
        }
        scheduleTick();
      }

      function endGame() {
        stopLoop();
        if (socket) {
          socket.close();
          socket = null;
        }
        pauseBtn.disabled = true;

        const snakes = state.snakes;
        const bestScore = Math.max(...snakes.map((s) => s.score));
        if (bestScore > highScore) {
          highScore = bestScore;
          localStorage.setItem(highKey(state.grid), highScore);
          highScoreEl.textContent = highScore;
        }

        // The board only runs out of food once every cell is a snake body,
        // i.e. the snake(s) together "cleared" it.
        const won = state.food === null;
        const solo = snakes.length === 1;
        let title;
        if (won) {
          title = 'AIクリア！ 🎉';
        } else if (solo) {
          title = snakes[0].stalled ? '行き詰まり（タイムアウト）' : 'ゲームオーバー';
        } else if (snakes[0].score === snakes[1].score) {
          title = '引き分け';
        } else {
          const winner = snakes[0].score > snakes[1].score ? 1 : 2;
          title = 'スネーク' + winner + ' の勝利！';
        }
        overlayTitle.textContent = title;

        overlayText.innerHTML = snakes.map((s, i) => {
          const tag = solo ? '' : 'S' + (i + 1) + ': ';
          const reason = s.alive ? '' : (s.stalled ? '（行き詰まり）' : '（死亡）');
          return tag + 'スコア <b>' + s.score + '</b>　長さ <b>' + s.length + '</b> ' + reason;
        }).join('<br>') + '<br>手数: <b>' + state.steps + '</b>';

        startBtn.textContent = 'もう一度';
        overlay.classList.remove('hidden');
        statusEl.textContent = '';
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        pauseBtn.textContent = paused ? '再開' : '一時停止';
        statusEl.textContent = paused ? '一時停止中' : 'AIが思考中...';
        if (!paused) scheduleTick();
      }

      function draw() {
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let i = 1; i < state.grid; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
        }

        // Food (absent once the board is completely full).
        if (state.food) {
          drawCircle(state.food[0], state.food[1], '#f43f5e');
        }

        // Snakes (a dead snake's body is already empty server-side).
        state.snakes.forEach((snake, i) => {
          const [headColor, bodyColor] = SNAKE_COLORS[i] || SNAKE_COLORS[0];
          snake.snake.forEach((seg, j) => {
            drawRect(seg[0], seg[1], j === 0 ? headColor : bodyColor);
          });
        });
      }

      function drawRect(x, y, color) {
        const px = x * CELL, py = y * CELL, r = Math.min(4, CELL / 4);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(px + 1 + r, py + 1);
        ctx.arcTo(px + CELL - 1, py + 1, px + CELL - 1, py + CELL - 1, r);
        ctx.arcTo(px + CELL - 1, py + CELL - 1, px + 1, py + CELL - 1, r);
        ctx.arcTo(px + 1, py + CELL - 1, px + 1, py + 1, r);
        ctx.arcTo(px + 1, py + 1, px + CELL - 1, py + 1, r);
        ctx.closePath();
        ctx.fill();
      }

      function drawCircle(x, y, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
      }

      startBtn.addEventListener('click', newGame);
      restartBtn.addEventListener('click', newGame);
      pauseBtn.addEventListener('click', togglePause);
      speedRange.addEventListener('input', () => {
        // Higher slider value = faster, so invert into a delay.
        stepDelay = 330 - Number(speedRange.value);
      });
      stepDelay = 330 - Number(speedRange.value);

      // Switching between solo and battle changes the number of snakes, so it
      // always starts a fresh game (a running one, or just to refresh the
      // idle board once a game exists).
      modeSelect.addEventListener('change', () => {
        applyMode();
        if (running || gameId) newGame();
      });

      // Changing an AI mid-game: if the new AI needs a different board size,
      // restart on the right board. Otherwise the switch is live and takes
      // effect on the next tick. (All current AIs run on any size.)
      strategySelects.forEach((select) => {
        select.addEventListener('change', () => {
          if (running && state && !fitsBoard(select.value, state.grid)) {
            newGame();
          }
        });
      });

      // The board size is authoritative on the server, so changing it starts a
      // new game. When idle, just show the chosen size's high score — the next
      // start picks the size up.
      gridSelect.addEventListener('change', () => {
        highScore = loadHighScore(Number(gridSelect.value));
        highScoreEl.textContent = highScore;
        if (running) newGame();
      });
    })();
  </script>
</body>
</html>
